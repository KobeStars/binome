# Build Windows et release GitHub à chaque tag vX.Y.Z.
# Publier une version : git tag v0.2.0 && git push origin v0.2.0
# Les apps installées la détectent dans les 4 heures (ou au prochain lancement).
# Bêta : git tag v0.2.0-beta.1. La release est marquée « préversion » : seules les apps
# réglées sur le canal bêta la reçoivent, les autres attendent la version stable.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Tests avec le Node d'Electron
        run: npm run test:electron

      - name: Types
        run: npm run typecheck

      # La version vient du tag : pas besoin de modifier package.json avant de publier.
      - name: Version depuis le tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}" -w @binome/desktop

      - name: Build
        run: npm run desktop:build
        env:
          # Variable du dépôt (Settings > Secrets and variables > Actions > Variables)
          MAIN_VITE_SIGNALING_URL: ${{ vars.SIGNALING_URL }}

      # La release est créée ici, en brouillon, avant l'envoi : sinon electron-builder envoie
      # ses fichiers en parallèle et chaque envoi crée sa propre release pour le même tag.
      # Un tag avec un tiret (v0.2.0-beta.1) est une bêta : préversion, jamais « latest ».
      - name: Brouillon de release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; NOTES="Version de test ${GITHUB_REF_NAME#v}"; else PRE=""; NOTES="Version ${GITHUB_REF_NAME#v}"; fi
          gh release create "$GITHUB_REF_NAME" --draft $PRE --title "${GITHUB_REF_NAME#v}" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installeur
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.config.cjs --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publiée seulement une fois tous les fichiers envoyés : les apps ne voient jamais une release incomplète.
      - name: Publication
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
